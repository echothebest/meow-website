<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#0f0f12" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Crimson Primary Glow Gradient -->
    <linearGradient id="primaryCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a55" />
      <stop offset="100%" stop-color="#990022" />
    </linearGradient>

    <!-- Deep Crimson Outer Glow/Accent -->
    <linearGradient id="darkCrimson" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>

    <!-- Glassmorphism Panel Fill -->
    <linearGradient id="glassPanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Metal Frame Stroke -->
    <linearGradient id="frameStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>

    <!-- Subtle Inner Eye Glow -->
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b8b" />
      <stop offset="40%" stop-color="#ff1a40" />
      <stop offset="100%" stop-color="#800018" />
    </radialGradient>

    <!-- Glow Filter for Glowing Accents -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Heavy Shadow for Depth -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow Behind Logo Body -->
  <circle cx="256" cy="230" r="140" fill="#dc2626" opacity="0.15" filter="url(#glowEffect)" />

  <!-- Main Container / Shadow Wrapper -->
  <g filter="url(#dropShadow)">

    <!-- Background Glassmorphic Shield/Panel (Rounded Octagon) -->
    <path d="M 160 80 
             L 352 80 
             L 432 160 
             L 432 320 
             L 352 400 
             L 160 400 
             L 80 320 
             L 80 160 Z" 
          fill="url(#glassPanel)" 
          stroke="url(#frameStroke)" 
          stroke-width="3" />

    <!-- Cat Ear Left (Outer Dark Frame) -->
    <path d="M 115 170 L 155 75 L 210 125 Z" 
          fill="#1c1917" 
          stroke="url(#darkCrimson)" 
          stroke-width="4" 
          stroke-linejoin="round" />

    <!-- Cat Ear Left (Inner Crimson Core) -->
    <path d="M 130 155 L 160 92 L 195 125 Z" 
          fill="url(#primaryCrimson)" />

    <!-- Cat Ear Right (Outer Dark Frame) -->
    <path d="M 397 170 L 357 75 L 302 125 Z" 
          fill="#1c1917" 
          stroke="url(#darkCrimson)" 
          stroke-width="4" 
          stroke-linejoin="round" />

    <!-- Cat Ear Right (Inner Crimson Core) -->
    <path d="M 382 155 L 352 92 L 317 125 Z" 
          fill="url(#primaryCrimson)" />

    <!-- Main Mask/Head Base Structure -->
    <path d="M 130 160 
             L 256 195 
             L 382 160 
             L 400 270 
             L 256 370 
             L 112 270 Z" 
          fill="#121215" 
          stroke="#27272a" 
          stroke-width="4" 
          stroke-linejoin="round" />

    <!-- Faceted Face Plates (Dark Matte Charcoal Overlay) -->
    <!-- Left Cheek Plate -->
    <path d="M 130 160 L 256 195 L 256 280 L 135 255 Z" 
          fill="#18181b" 
          opacity="0.9" />
    
    <!-- Right Cheek Plate -->
    <path d="M 382 160 L 256 195 L 256 280 L 377 255 Z" 
          fill="#202024" 
          opacity="0.9" />

    <!-- Lower Jaw/Chin Facet Left -->
    <path d="M 135 255 L 256 280 L 256 370 L 112 270 Z" 
          fill="#0f0f11" />

    <!-- Lower Jaw/Chin Facet Right -->
    <path d="M 377 255 L 256 280 L 256 370 L 400 270 Z" 
          fill="#141417" />

    <!-- High-Tech Aggressive Cyber Eyes (Crimson Glow) -->
    <!-- Left Eye -->
    <polygon points="150,205 220,225 210,240 160,230" 
             fill="url(#eyeGlow)" 
             filter="url(#glowEffect)" />
    <polygon points="150,205 220,225 210,240 160,230" 
             fill="#ffffff" 
             opacity="0.6" />

    <!-- Right Eye -->
    <polygon points="362,205 292,225 302,240 352,230" 
             fill="url(#eyeGlow)" 
             filter="url(#glowEffect)" />
    <polygon points="362,205 292,225 302,240 352,230" 
             fill="#ffffff" 
             opacity="0.6" />

    <!-- Nose / Center Accent Notch -->
    <polygon points="256,245 248,258 264,258" fill="#ff2a55" />

    <!-- Mechanical Whisker / Cyber Accents -->
    <!-- Left Top Whisker -->
    <path d="M 110 220 L 50 210 L 60 218 L 115 226 Z" fill="url(#primaryCrimson)" />
    <!-- Left Bottom Whisker -->
    <path d="M 100 245 L 30 240 L 40 247 L 105 250 Z" fill="#3f3f46" />

    <!-- Right Top Whisker -->
    <path d="M 402 220 L 462 210 L 452 218 L 397 226 Z" fill="url(#primaryCrimson)" />
    <!-- Right Bottom Whisker -->
    <path d="M 412 245 L 482 240 L 472 247 L 407 250 Z" fill="#3f3f46" />

    <!-- Forehead Tech Crest (Crimson Accent) -->
    <path d="M 236 140 L 256 120 L 276 140 L 256 180 Z" fill="url(#primaryCrimson)" opacity="0.85" />
    <circle cx="256" cy="150" r="3" fill="#ffffff" filter="url(#glowEffect)" />

  </g>

  <!-- Typography: MEOW CLIENT -->
  <!-- "MEOW" - Bold Glowing Crimson/White -->
  <text x="256" y="440" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-weight="900" 
        font-size="34" 
        letter-spacing="6" 
        fill="#ffffff" 
        text-anchor="middle">
    MEOW
  </text>
  
  <!-- "CLIENT" - Monospace Technical Subtext -->
  <text x="256" y="468" 
        font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" 
        font-weight="700" 
        font-size="14" 
        letter-spacing="10" 
        fill="#ff2a55" 
        text-anchor="middle"
        opacity="0.9">
    CLIENT
  </text>

  <!-- Subtle Outer Border Accent Frame -->
  <rect x="16" y="16" width="480" height="480" rx="84" 
        fill="none" 
        stroke="#ffffff" 
        stroke-opacity="0.05" 
        stroke-width="2" />
</svg>
